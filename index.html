<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <!-- Fuentes de Google (opcional, si no hay internet se usarán las del sistema) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal (Efecto Tarjeta) */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Foto de Perfil (Avatar) */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #22D4FD;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #333;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Títulos y Texto */
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 300;
            color: #22D4FD;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        /* Botones de Redes Sociales */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 50px;
            background: #FFD700;
            color: #1e3c72;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #fff;
            color: #1e3c72;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(34, 212, 253, 0.5);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #22D4FD;
            color: #22D4FD;
        }

        .btn-outline:hover {
            background: #22D4FD;
            color: #1e3c72;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Avatar: Puedes cambiar el src por una imagen tuya -->
        <div class="avatar">
            <img src="https://ui-avatars.com/api/?name=Antonio+Callahuara&background=22D4FD&color=1e3c72&size=120" alt="Avatar">
        </div>

        <h1>Antonio Callahuara</h1>
        <div class="subtitle">CursoGit</div>

        <p class="description">
            Bienvenido a mi primera página web.
        </p>

        <div class="social-links">
            <a href="https://github.com/AntonioCallahuara" class="btn" target="_blank">GitHub</a>
            <a href="#" class="btn btn-outline">Contacto</a>
        </div>
    </div>

</body>
</html>
